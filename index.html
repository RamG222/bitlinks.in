<script>
(function () {
  var EMAIL = "shriramgupta8141@gmail.com";
  var btn = document.getElementById("copy"), label = document.getElementById("label"), timer;
  function flash(msg, ok) {
    label.textContent = msg;
    btn.classList.toggle("copied", ok);
    clearTimeout(timer);
    timer = setTimeout(function () { label.textContent = EMAIL; btn.classList.remove("copied"); }, 2000);

  function fallback() {
    var t = document.createElement("textarea");

    document.body.appendChild(t); t.select();
    var ok = false;

    document.body.removeChild(t);
    flash(ok ? "Copied!" : "Press Ctrl+C to copy", ok);
  }
  btn.addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(EMAIL).then(function () { flash("Copied!", true); }, fallback);
    } else { fallback(); }
  });
})();
